name: mlkit_app
description: Google ML Kit App - Vision, NLP & Generative AI

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^8.0.2
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  get_it: ^8.0.3
  
  # Navigation
  go_router: ^17.1.0
  
  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # ML Kit
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_object_detection: ^0.15.1
  google_mlkit_image_labeling: ^0.14.2
  google_mlkit_barcode_scanning: ^0.14.2
  google_mlkit_language_id: ^0.13.1
  google_mlkit_translation: ^0.13.1
  google_mlkit_smart_reply: ^0.13.1
  google_mlkit_entity_extraction: ^0.15.3
  
  # Camera & Image
  camera: ^0.12.0
  image_picker: ^1.0.7
  image: ^4.1.4
  
  # Utils
  intl: ^0.20.2
  logger: ^2.0.2+1
  uuid: ^4.3.3
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.1
  url_launcher: ^6.3.1
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
